    :root {
      --ML__static-fonts: true;

  <script>
    // Configure MathLive to use CDN fonts and prevent local font loading
    window.MathfieldElement = window.MathfieldElement || {};
    window.MathfieldElement.fontsDirectory = null;
    
    // Set static fonts flag to prevent font loading
    if (typeof document !== 'undefined') {
      document.documentElement.style.setProperty('--ML__static-fonts', 'true');
    }
  </script>
